name: Harvest photos

# Teaching data for the brain: finds freely licensed photo sets of Indian events (weddings,
# birthdays, functions, from every state) on Wikimedia Commons, measures them on build machines
# with the app's own models and rules (tools/harvest), and keeps only the numbers and the credits
# on the harvest-data branch. The photos are deleted right after measuring and never reach the app.
# Started by hand, or by changing tools/harvest/run.json (machines, photos per machine, recrawl);
# each run adds sets not measured before.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/harvest/run.json']
  workflow_dispatch:
    inputs:
      machines:
        description: "Build machines working at once"
        default: "4"
      photos_per_machine:
        description: "Most photos each machine measures this run"
        default: "2000"
      recrawl:
        description: "Look for photo sets again (yes / no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      machines: ${{ steps.matrix.outputs.machines }}
      count: ${{ steps.settings.outputs.count }}
      photos: ${{ steps.settings.outputs.photos }}
    steps:
      - uses: actions/checkout@v4

      - id: settings
        name: Settings (by hand, or tools/harvest/run.json)
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          run = json.load(open("tools/harvest/run.json")) if os.path.exists("tools/harvest/run.json") else {}
          given = {"machines": "${{ inputs.machines }}", "photos_per_machine": "${{ inputs.photos_per_machine }}", "recrawl": "${{ inputs.recrawl }}"}
          pick = lambda k, d: given[k] or str(run.get(k, d))
          print(f"count={pick('machines', 2)}")
          print(f"photos={pick('photos_per_machine', 1000)}")
          print(f"recrawl={pick('recrawl', 'no')}")
          EOF

      - name: Find photo sets (or reuse the list found before)
        run: |
          touch done.txt seen.txt
          if git fetch -q --depth 1 origin harvest-data; then
            git show FETCH_HEAD:done.txt > done.txt 2>/dev/null || true
            # Every photo measured before (web address and picture fingerprint): never measured twice.
            git show FETCH_HEAD:seen.txt > seen.txt 2>/dev/null || true
            git show FETCH_HEAD:sets.jsonl > sets.jsonl 2>/dev/null || true
          fi
          # Look again for at most 70 minutes, adding to the sets found before.
          if [ "${{ steps.settings.outputs.recrawl }}" = yes ] || [ ! -s sets.jsonl ]; then python3 tools/harvest/crawl.py sets.jsonl 1500 70; fi
          echo "$(wc -l < sets.jsonl) sets known, $(wc -l < done.txt) measured before, $(wc -l < seen.txt) photos seen"

      - uses: actions/upload-artifact@v4
        with:
          name: sets
          path: |
            sets.jsonl
            done.txt
            seen.txt

      - id: matrix
        run: echo "machines=$(python3 -c "import json; print(json.dumps(list(range(int('${{ steps.settings.outputs.count }}')))))")" >> "$GITHUB_OUTPUT"

  measure:
    needs: find
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJson(needs.find.outputs.machines) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The same versions the computer copy was checked with against the phone (check_parity.py).
      # MediaPipe's face reader loads the graphics library even on the CPU (run 1 measured nothing without it).
      - run: sudo apt-get install -y --no-install-recommends libegl1 libgles2
      - run: pip install --quiet mediapipe==1.1.1 onnxruntime==1.29.0 numpy==2.5.3 pillow==12.3.0

      - uses: actions/download-artifact@v4
        with:
          name: sets

      - name: Download, measure and delete
        run: |
          python3 tools/harvest/harvest.py sets.jsonl app/src/main/assets/models out ${{ matrix.machine }} \
            ${{ needs.find.outputs.count }} ${{ needs.find.outputs.photos }} done.txt 1 seen.txt 2>harvest-errors.log || true
          tail -n 20 harvest-errors.log | grep -v "^W0000\|^I0000" || true
          n=$(ls out/*.jsonl 2>/dev/null | wc -l)
          echo "$n sets measured"
          # Nothing measured from a non-empty share is a broken machine, not a quiet day.
          if [ "$n" = 0 ] && [ -s harvest-errors.log ]; then tail -n 40 harvest-errors.log; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: measured-${{ matrix.machine }}
          path: out/
          if-no-files-found: ignore

  keep:
    needs: [find, measure]
    if: always() && needs.find.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - uses: actions/download-artifact@v4
        with:
          path: new
          pattern: measured-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sets

      - name: Group faces into people with the app's own rules
        run: |
          mkdir -p new
          if ls new/*.raw.txt >/dev/null 2>&1; then gradle --no-daemon -q -p tools/harvest/jvm run --args="$PWD/new"; fi

      - name: Add to the harvest-data branch
        run: |
          mkdir -p data
          if git fetch -q --depth 1 origin harvest-data; then git archive FETCH_HEAD | tar -x -C data; fi
          mkdir -p data/sets
          # Contact sheets (a share of the sets) go to their own branch, to keep the numbers small.
          mkdir -p sheets
          if git fetch -q --depth 1 origin harvest-sheets; then git archive FETCH_HEAD | tar -x -C sheets; fi
          cp new/*.sheet-*.jpg sheets/ 2>/dev/null || true
          for f in new/*.jsonl; do
            [ -e "$f" ] || continue
            id=$(basename "$f" .jsonl)
            gzip -c "$f" > "data/sets/$id.jsonl.gz"
            cp "new/$id.plan.txt" "new/$id.credits.json" data/sets/ 2>/dev/null || true
            echo "$id" >> done.txt
          done
          sort -u done.txt > data/done.txt
          # Every photo ever measured, also from sets kept before this list existed.
          python3 - <<'EOF'
          import glob, gzip, json
          seen = set(l.rstrip("\n") for f in ["seen.txt"] + glob.glob("new/*.seen.txt") for l in open(f) if l.strip())
          for cred in glob.glob("data/sets/*.credits.json"):
              sid = cred[len("data/sets/"):-len(".credits.json")]
              try:
                  rows = {r["name"]: r for r in map(json.loads, gzip.open(f"data/sets/{sid}.jsonl.gz", "rt"))}
              except OSError:
                  rows = {}
              for f in json.load(open(cred))["files"]:
                  key = (f.get("page") or f.get("thumb") or f.get("title") or "").strip()
                  h = rows.get(f["file"], {}).get("hash")
                  seen.add(f"{key}\t{'' if h is None else int(h)}")
          open("data/seen.txt", "w").write("".join(sorted(x + "\n" for x in seen)))
          print(len(seen), "photos seen in all")
          EOF
          cp sets.jsonl data/sets.jsonl
          python3 - <<'EOF'
          import glob, json, collections
          sets = [json.load(open(f)) for f in sorted(glob.glob("data/sets/*.credits.json"))]
          by = collections.Counter(s["occasion"] for s in sets)
          photos = sum(len(s["files"]) for s in sets)
          with open("data/README.md", "w") as fh:
              fh.write("# Harvested measurements\n\nNumbers measured from freely licensed photos on Wikimedia Commons by the app's\n"
                       "own models and rules (tools/harvest). No photos are kept. Each set's photographers,\n"
                       "licences and source pages are in sets/<id>.credits.json.\n\n")
              fh.write(f"{len(sets)} sets, {photos} photos\n\n")
              for o, n in by.most_common():
                  fh.write(f"- {o}: {n} sets\n")
          print(f"{len(sets)} sets, {photos} photos", dict(by))
          EOF
          cd data
          git init -q -b harvest-data
          git config user.name "harvest"
          git config user.email "harvest@users.noreply.github.com"
          git add -A
          git commit -q -m "Harvest run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" harvest-data
          cd ../sheets
          if ls *.jpg >/dev/null 2>&1; then
            git init -q -b harvest-sheets
            git config user.name "harvest"
            git config user.email "harvest@users.noreply.github.com"
            git add -A
            git commit -q -m "Contact sheets, harvest run ${{ github.run_number }}"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" harvest-sheets
          fi
