name: Real couple's photos

# A real wedding shared by its photographer, with the couple's and photographer's permission: the
# raw photos (a Google Drive folder, sub-folders = events) and the printed album (a PDF). The
# REAL_LINKS secret holds the raw folder's link (and optionally the album PDF's on a second line),
# never written anywhere else. The owner can instead give Claude the PDF directly, after Claude's
# blind picks: the raw step keeps small copies of every photo for matching on Claude's machine. Everything kept is locked with Claude's public key (tools/realphotos/lock.sh): only
# Claude can open it, and no secret is needed for that. The log shows counts only (the repo can be
# public for a while). Started by changing tools/realphotos/run.json:
#   step "raw":   every photo checked the way the app does, people grouped, the app's album, and
#                 numbered contact sheets for Claude's blind picks (real-data branch, locked).
#   step "album": only after Claude's picks are in tools/realphotos/picks/NAME-claude.txt: the album
#                 PDF's photos are found among the raw photos (match_album.py), and the app's and
#                 Claude's albums are scored against the couple's (AlbumScore.kt).
on:
  push:
    branches: ['claude/**']
    paths: ['tools/realphotos/run.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-photos
  cancel-in-progress: false

jobs:
  wedding:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Read the run settings and the links
        id: s
        env:
          LINKS: ${{ secrets.REAL_LINKS }}
        run: |
          test -n "$LINKS" || { echo "Add the REAL_LINKS secret: the raw photos folder link, then the album PDF link, one per line"; exit 1; }
          raw=$(printf '%s\n' "$LINKS" | sed -n 1p | tr -d '\r '); album=$(printf '%s\n' "$LINKS" | sed -n 2p | tr -d '\r ')
          echo "::add-mask::$raw"; [ -n "$album" ] && echo "::add-mask::$album"
          get() { python3 -c "import json; print(json.load(open('tools/realphotos/run.json')).get('$1', '$2'))"; }
          echo "name=$(get name wedding-1)" >> "$GITHUB_OUTPUT"
          echo "occasion=$(get occasion WEDDING)" >> "$GITHUB_OUTPUT"
          echo "step=$(get step raw)" >> "$GITHUB_OUTPUT"
          { echo "RAW_LINK=$raw"; echo "ALBUM_LINK=$album"; } >> "$GITHUB_ENV"
          echo "step $(get step raw) for $(get name wedding-1)"

      - name: Make room on the build machine
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/lib/android && df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The same versions as the harvest (checked against the phone by check_parity.py).
      - run: |
          sudo apt-get install -y --no-install-recommends libegl1 libgles2 poppler-utils > /dev/null
          pip install --quiet mediapipe==1.1.1 onnxruntime==1.29.0 numpy==2.5.3 pillow==12.3.0 gdown==5.2.0 \
            openpyxl==3.1.5 opencv-python-headless==4.11.0.86 pillow-heif==0.21.0 google-auth==2.38.0 requests==2.32.3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Google sign-in for reading the Drive share
        env:
          KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/g" && printf '%s' "$KEY" > "$RUNNER_TEMP/g/key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/g/key.json" >> "$GITHUB_ENV"

      # The raw photos (made 2560 px, about what the app reads, so a whole wedding fits on the
      # machine) and the measurements, kept between the two steps.
      - name: Raw photos and measurements from an earlier run
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work
          key: real-${{ steps.s.outputs.name }}-v1

      - name: Download the raw photos
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 tools/realphotos/drive_fetch.py "$RAW_LINK" work/in --max-long-side 2560

      - name: Check every photo the way the app does
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 tools/realphotos/prepare.py work/in work/out 4
          for i in 0 1 2 3; do
            [ -d work/out/shard-$i ] || continue
            python3 tools/harvest/measure.py app/src/main/assets/models work/out/m-$i.jsonl work/out/shard-$i 2> work/out/measure-$i.log &
          done
          wait
          cat work/out/m-*.jsonl | python3 -c "
          import json, sys
          rows = [json.loads(l) for l in sys.stdin if l.strip()]
          rows.sort(key=lambda r: (r['folder'], r['name']))
          sys.stdout.write(''.join(json.dumps(r) + '\n' for r in rows))
          print(len(rows), 'photos measured,', sum(r.get('failed', False) for r in rows), 'unreadable', file=sys.stderr)
          " > work/out/real.jsonl
          python3 tools/harvest/to_dump.py work/out/real.jsonl work/out/real.raw.txt "${{ steps.s.outputs.occasion }}"
          gradle --no-daemon -q -p tools/harvest/jvm run --args="$PWD/work/out"
          test -s work/out/real.plan.txt
          rm -rf work/out/shard-* work/out/m-*.jsonl

      - name: Keep them for the album step
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work
          key: real-${{ steps.s.outputs.name }}-v1

      # The app's own album is made in the album step, at the couple's album size, so both are the
      # same size; the app's rules do not change in between.
      - name: Contact sheets for Claude's blind picks
        if: steps.s.outputs.step == 'raw'
        run: |
          mkdir -p keep
          raw="$(cat work/out/raw-dir.txt)"
          python3 tools/realphotos/sheets.py "$raw" keep/raw
          cp work/out/real.plan.txt work/out/inventory.txt keep/raw/
          # Small copies (800 px) of every raw photo, for finding the printed album's photos among
          # them on Claude's machine when the owner shares the album PDF there.
          python3 - "$raw" keep/raw/small <<'PY'
          import os, sys
          from PIL import Image, ImageOps
          raw, out = sys.argv[1], sys.argv[2]
          n = 0
          for root, _, files in os.walk(raw):
              for f in files:
                  if not f.lower().endswith((".jpg", ".jpeg", ".png", ".webp")):
                      continue
                  rel = os.path.relpath(os.path.join(root, f), raw)
                  dst = os.path.join(out, os.path.splitext(rel)[0] + ".jpg")
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  with Image.open(os.path.join(root, f)) as im:
                      im = ImageOps.exif_transpose(im).convert("RGB")
                      im.thumbnail((800, 800))
                      im.save(dst, quality=80)
                  n += 1
          print(n, "small copies")
          PY

      - name: The couple's album, found among the raw photos, and the scores
        if: steps.s.outputs.step == 'album'
        run: |
          name="${{ steps.s.outputs.name }}"
          test -s "tools/realphotos/picks/$name-claude.txt" || { echo "Claude's blind picks are not in yet: tools/realphotos/picks/$name-claude.txt"; exit 1; }
          test -n "$ALBUM_LINK" || { echo "The second line of REAL_LINKS (the album PDF link) is missing"; exit 1; }
          mkdir -p keep/album work/pdf work/pages
          python3 tools/realphotos/drive_fetch.py "$ALBUM_LINK" work/pdf
          pdf=$(find work/pdf -iname '*.pdf' | head -1); test -n "$pdf"
          pdftoppm -r 150 -jpeg -jpegopt quality=85 "$pdf" work/pages/page
          raw="$(cat work/out/raw-dir.txt)"
          python3 tools/realphotos/sheets.py "$raw" work/idx --index-only
          python3 tools/realphotos/match_album.py "$raw" work/idx/index.tsv work/pages keep/album
          gradle --no-daemon -q -p tools/harvest/jvm run --args="score $PWD/work/out/real.plan.txt $PWD/keep/album/album-picks.txt $PWD/keep/album/score.txt claude=$PWD/tools/realphotos/picks/$name-claude.txt"
          # The album's pages, smaller, for Claude to check the matches by eye.
          mkdir -p keep/album/pages && for f in work/pages/*.jpg; do python3 -c "
          import sys; from PIL import Image
          im = Image.open(sys.argv[1]); im.thumbnail((1600, 1600)); im.save(sys.argv[2], quality=80)" "$f" "keep/album/pages/$(basename "$f")"; done
          cp work/idx/index.tsv keep/album/

      - name: Lock and keep on the real-data branch
        run: |
          name="${{ steps.s.outputs.name }}"; step="${{ steps.s.outputs.step }}"
          # In parts under GitHub's 100 MB file limit, each locked on its own.
          tar -cf bundle.tar -C keep .
          split -b 90m -d -a 2 bundle.tar part-
          rm -rf keep bundle.tar
          for p in part-*; do sh tools/realphotos/lock.sh "$p" "$name-$step.$p.locked"; rm "$p"; done
          ls -la *.locked
          mkdir out && cd out
          git init -q -b real-data
          # On top of what is kept already (a second step adds to the first's files).
          if git fetch -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" real-data; then git reset -q --hard FETCH_HEAD; fi
          rm -f "$name-$step".*.locked
          mv ../"$name-$step".*.locked .
          printf '# Real couples (locked)\n\nA real wedding shared with permission, locked with Claude'"'"'s public key. Only Claude can open it.\n' > README.md
          git config user.name "real-photos"
          git config user.email "real-photos@users.noreply.github.com"
          git add -A
          git commit -q -m "Real photos: $name, step $step"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:real-data
          echo "kept $name-$step (locked, $(ls "$name-$step".*.locked | wc -l) parts)"

      - name: Remove the photos from the build machine
        if: always()
        run: rm -rf work keep bundle.tar "$RUNNER_TEMP/g"
