name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check the bundled model files
        run: cd app/src/main/assets && sha256sum -c ../../../models.sha256

      - name: Run tests and build the app
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Check the app has no internet permission
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "The app must not ask for internet access."; exit 1
          fi

      - name: Publish the app file for the phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AlbumDone.apk
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build AlbumDone.apk \
            --prerelease \
            --title "Album Done test build ${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}. Download AlbumDone.apk on your Android phone and open it to install."
