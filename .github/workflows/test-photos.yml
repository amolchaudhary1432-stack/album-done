name: Test photos

# Finds or downloads freely licensed wedding photos for the phone test (test data only, never
# inside the app), and puts them on the test-photos branch. Runs when tools/test-photos changes.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/test-photos/**']
  workflow_dispatch:

permissions:
  contents: write

# Only the newest request counts; an older run still going would overwrite its photos.
concurrency:
  group: test-photos
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Find or download the photos
        run: |
          mode=$(python3 -c "import json; print(json.load(open('tools/test-photos/request.json'))['mode'])")
          mkdir -p out
          if [ "$mode" = discover ]; then
            python3 tools/test-photos/commons.py discover out/discover
          elif [ "$mode" = quirky ]; then
            # Keep the real wedding, add the replica raw dump made from it.
            pip install --quiet piexif onnxruntime pillow numpy
            git fetch -q --depth 1 origin test-photos
            git archive FETCH_HEAD wedding | tar -x -C out
            python3 tools/test-photos/quirky.py out/wedding out/quirky app/src/main/assets/models/face_detection_yunet_2026may.onnx
            du -sh out/quirky
          elif [ "$mode" = fetch ] && python3 -c "import json,sys; sys.exit(0 if 'sets' in json.load(open('tools/test-photos/request.json')) else 1)"; then
            # More weddings next to the ones already there.
            pip install --quiet piexif
            git fetch -q --depth 1 origin test-photos && git archive FETCH_HEAD | tar -x -C out
            rm -f out/RUN.txt
            python3 tools/test-photos/commons.py fetch-sets tools/test-photos/request.json out
            du -sh out/*
          else
            pip install --quiet piexif
            python3 tools/test-photos/commons.py fetch tools/test-photos/request.json out/wedding
            du -sh out/wedding
          fi

      - name: Put them on the test-photos branch
        run: |
          echo "Run ${{ github.run_number }} for commit ${{ github.sha }}" > out/RUN.txt
          cd out
          git init -q -b test-photos
          git config user.name "test-photos"
          git config user.email "test-photos@users.noreply.github.com"
          git add -A
          git commit -q -m "Test photos run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-photos
