name: Scene model check

# Tests an image-text model on freely licensed wedding photos before it is considered for the app
# (does it recognise pheras, varmala, haldi...?). Results go to the scene-eval-results branch.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/scene-eval/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the model tools
        run: |
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          pip install --quiet "transformers>=4.49" pillow sentencepiece protobuf scikit-learn

      - name: Run the check
        run: |
          mode=$(python3 -c "import json; print(json.load(open('tools/scene-eval/request.json')).get('mode', 'zero-shot'))")
          if [ "$mode" = probe ]; then
            python3 tools/scene-eval/probe.py tools/scene-eval/request.json out
          else
            python3 tools/scene-eval/eval.py tools/scene-eval/request.json out
          fi

      - name: Put the results on the scene-eval-results branch
        if: always()
        run: |
          mkdir -p out
          echo "Run ${{ github.run_number }} for commit ${{ github.sha }}" > out/RUN.txt
          cd out
          git init -q -b scene-eval-results
          git config user.name "scene-eval"
          git config user.email "scene-eval@users.noreply.github.com"
          git add -A
          git commit -q -m "Scene model check run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" scene-eval-results
