name: Search photo sets

# The wide search for teaching data (toward 1 lakh photos): many build machines each run a share
# of the searches (tools/harvest/crawl.py with CRAWL_SHARD), then their finds are joined into
# sets.jsonl on the harvest-data branch. Searches done are remembered (searched.txt), so each run
# carries on. Measuring is the "Harvest photos" workflow, run afterwards with recrawl = no.
# Started by hand, or by changing tools/harvest/search.json (machines, minutes).
on:
  push:
    branches: ['claude/**']
    paths: ['tools/harvest/search.json']
  workflow_dispatch:
    inputs:
      machines:
        description: "Search machines working at once"
        default: "10"
      minutes:
        description: "Minutes each machine searches"
        default: "300"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
      machines: ${{ steps.m.outputs.machines }}
      minutes: ${{ steps.m.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          machines="${{ inputs.machines }}"; minutes="${{ inputs.minutes }}"
          if [ -z "$machines" ]; then
            machines=$(python3 -c "import json; print(json.load(open('tools/harvest/search.json'))['machines'])")
            minutes=$(python3 -c "import json; print(json.load(open('tools/harvest/search.json'))['minutes'])")
          fi
          echo "machines=$machines" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($machines))))")" >> "$GITHUB_OUTPUT"

  search:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Search my share
        run: |
          mkdir -p work
          if git fetch -q --depth 1 origin harvest-data; then
            for f in sets.jsonl searched.txt categories.txt; do git show "FETCH_HEAD:$f" > "work/$f" 2>/dev/null || rm -f "work/$f"; done
          fi
          deep=$(python3 -c "import json; print('1' if json.load(open('tools/harvest/search.json')).get('deep') else '')")
          CRAWL_DEEP=$deep CRAWL_SHARD=${{ matrix.shard }}/${{ needs.plan.outputs.machines }} CRAWL_KEEP_SMALL=1 \
            python3 tools/harvest/crawl.py work/sets.jsonl 1500 ${{ needs.plan.outputs.minutes }} || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: found-${{ matrix.shard }}
          path: |
            work/sets.jsonl
            work/searched.txt
          if-no-files-found: ignore

  join:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: found-*

      - name: Join the finds and keep them on harvest-data
        run: |
          mkdir -p data
          if git fetch -q --depth 1 origin harvest-data; then git archive FETCH_HEAD | tar -x -C data; fi
          python3 tools/harvest/merge_sets.py data parts/*/
          cd data
          git init -q -b harvest-data
          git config user.name harvest
          git config user.email harvest@users.noreply.github.com
          git add -A
          git commit -q -m "Search run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" harvest-data
