name: Phone test

# Runs the real app on an Android emulator: photo analysis on real photos, the background
# worker, and a walk through every screen with screenshots (kept as a download on the run page).
on:
  push:
    branches: ['claude/**']
    paths-ignore: ['tools/**', '.github/workflows/test-photos.yml', '.github/workflows/scene-eval.yml', 'docs/**', '*.md', '.gitignore']
  workflow_dispatch:
    inputs:
      photos:
        description: "Which test wedding: wedding (Bengali), quirky (replica raw dump), rajasthan, garhwali"
        default: wedding
      album_size:
        description: "Album size for the test wedding (empty: a quarter of the photos)"
        default: ""
  workflow_call:

# Needed to send screenshots and logs to the phone-test-results branch.
permissions:
  contents: write

jobs:
  phone-test:
    # Run by hand, this workflow only checks a test wedding (the job below); the walk-through
    # runs on every push, and a newer push replaces a run still in progress.
    if: github.event_name != 'workflow_dispatch'
    concurrency:
      group: phone-test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The emulator needs several GB of disk; remove large tools this job never uses.
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Allow the emulator to use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its phone tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run the tests on an Android 16 emulator (Pixel 7 size)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          profile: pixel_7
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell cmd uimode night yes || true
            adb shell cmd uimode night no || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            mkdir -p screens && (adb exec-out run-as com.albumdone.app tar -c files/screens > screens/screens.tar || true)
            adb logcat -d > logcat.txt || true
            adb logcat -d -s AlbumDoneTest > test-log.txt || true
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash log =====" && (tail -n 120 crash.txt || true)
            echo "===== app errors =====" && (grep -E " E (AndroidRuntime|DEBUG|libc|MediaPipe|onnxruntime|tflite|AlbumDone)|F (DEBUG|libc)|Fatal signal|SIGILL|SIGSEGV|SIGABRT" logcat.txt | tail -n 80 || true)
            test ! -f tests-failed

      # Claude reads these from the phone-test-results branch (one commit per run).
      - name: Send screenshots and logs to the phone-test-results branch
        if: always()
        run: |
          mkdir -p out/screens
          if [ -f screens/screens.tar ]; then tar -xf screens/screens.tar -C out/screens; fi
          for f in test-log.txt crash.txt; do [ -f "$f" ] && cp "$f" out/; done
          [ -f logcat.txt ] && tail -n 20000 logcat.txt > out/logcat.txt
          [ -d app/build/outputs/androidTest-results ] && cp -r app/build/outputs/androidTest-results out/ || true
          echo "Run ${{ github.run_number }} for commit ${{ github.sha }}" > out/RUN.txt
          cd out
          git init -q -b phone-test-results
          git config user.name "phone-test"
          git config user.email "phone-test@users.noreply.github.com"
          git add -A
          git commit -q -m "Phone test run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" phone-test-results

      - name: Keep the screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-results
          path: |
            screens/
            logcat.txt
            test-log.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # A real wedding: freely licensed photos from the test-photos branch, checked on the emulator in
  # parallel with the screen tests. The decision report and screenshots go to the
  # real-wedding-results branch. Branch pushes only; does nothing until the photos exist.
  real-wedding:
    # Takes about half an hour, so it runs only when started by hand (Run workflow) on a claude/ branch.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Get the test wedding photos
        id: photos
        run: |
          set_name="${{ inputs.photos || 'wedding' }}"
          if git fetch -q --depth 1 origin test-photos && git cat-file -e "FETCH_HEAD:$set_name/CREDITS.json"; then
            mkdir -p app/src/androidTest/assets tmp-photos
            git archive FETCH_HEAD "$set_name" | tar -x -C tmp-photos
            mv "tmp-photos/$set_name" app/src/androidTest/assets/wedding
            echo "$(find app/src/androidTest/assets/wedding -name '*.jpg' | wc -l) photos"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test wedding photos yet"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make room on the build machine
        if: steps.photos.outputs.found == 'true'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift

      - uses: actions/setup-java@v4
        if: steps.photos.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.photos.outputs.found == 'true'
        with:
          gradle-version: "8.14.3"

      - name: Allow the emulator to use hardware speed-up
        if: steps.photos.outputs.found == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its phone tests
        if: steps.photos.outputs.found == 'true'
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Check the real wedding on an Android 16 emulator (Pixel 7 size)
        if: steps.photos.outputs.found == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          profile: pixel_7
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell cmd uimode night yes || true
            adb shell cmd uimode night no || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.albumdone.app.RealWeddingDeviceTest -Pandroid.testInstrumentationRunnerArguments.albumSize=${{ inputs.album_size || '0' }} -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch tests-failed
            mkdir -p screens && (adb exec-out run-as com.albumdone.app tar -c files/screens > screens/screens.tar || true)
            adb logcat -d > logcat.txt || true
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash log =====" && (tail -n 120 crash.txt || true)
            test ! -f tests-failed

      - name: Send the report and screenshots to the real-wedding-results branch
        if: always() && steps.photos.outputs.found == 'true'
        run: |
          mkdir -p out/screens
          if [ -s screens/screens.tar ]; then tar -xf screens/screens.tar -C out/screens || echo "no screenshots"; fi
          [ -f crash.txt ] && cp crash.txt out/ || true
          [ -f logcat.txt ] && tail -n 20000 logcat.txt > out/logcat.txt || true
          [ -d app/build/outputs/androidTest-results ] && cp -r app/build/outputs/androidTest-results out/ || true
          echo "Run ${{ github.run_number }} for commit ${{ github.sha }}, photos: ${{ inputs.photos || 'wedding' }}" > out/RUN.txt
          branch=real-wedding-results
          if [ "${{ inputs.photos || 'wedding' }}" = quirky ]; then branch=quirky-results; fi
          cd out
          git init -q -b "$branch"
          git config user.name "phone-test"
          git config user.email "phone-test@users.noreply.github.com"
          git add -A
          git commit -q -m "Real wedding run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"
