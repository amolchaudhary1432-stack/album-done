name: Phone test

# Runs the real app on an Android emulator: photo analysis on real photos, the background
# worker, and a walk through every screen with screenshots (kept as a download on the run page).
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
  workflow_call:

jobs:
  phone-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The emulator needs several GB of disk; remove large tools this job never uses.
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Allow the emulator to use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its phone tests
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run the tests on an Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          cores: 4
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || (adb logcat -d > logcat.txt; adb pull /sdcard/Android/data/com.albumdone.app/files/screens screens; exit 1)
            adb pull /sdcard/Android/data/com.albumdone.app/files/screens screens || true
            adb logcat -d -s AlbumDoneTest > test-log.txt || true

      - name: Keep the screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test-results
          path: |
            screens/
            logcat.txt
            test-log.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
