name: Real phone test

# The real app on a real phone in Firebase Test Lab (Google's phones in a data centre): real
# wedding photos from the test-photos branch, the real background job, and the album screens
# (RealWeddingDeviceTest). Shows the true speed on a phone, unlike the emulator, which runs the
# models through ARM translation. Test Lab records the screen; the video, logs, screenshots and
# the per-photo report go to the real-phone-results branch.
# Needs the FIREBASE_KEY secret (a service account key for project album-done-test with the
# Cloud Testing and Cloud Tool Results APIs on). The free plan allows 5 real-phone runs a day.
# Started by hand, or by changing tools/realphone/run.json (photos, album_size, device, minutes).
# With "fetch": "<bucket>/<results dir>" in run.json it only collects an earlier run's results
# again, without using a phone.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/realphone/run.json']
  workflow_dispatch:
    inputs:
      photos:
        description: "Photo set from the test-photos branch (wedding, quirky, ...)"
        default: "wedding"
      album_size:
        description: "Album size (0 = a quarter of the photos)"
        default: "30"
      device:
        description: "Test Lab phone id (empty = a mid-range Samsung)"
        default: ""
      minutes:
        description: "Most minutes the phone may take (45 at most)"
        default: "40"
      tests:
        description: "real = the real-photo test only; journey = start to finish with every photo; all = every phone test"
        default: "real"

permissions:
  contents: write

# Each push its own run, so several phones can be tested at the same time.
concurrency:
  group: real-phone-${{ github.sha }}
  cancel-in-progress: false

env:
  PROJECT: album-done-test

jobs:
  # The photos first, on their own: Wikimedia makes new thumbnails slowly for each machine (a few
  # a minute), so thousands can take hours. Downloaded photos are kept in the Actions cache and a
  # later run carries on from them; the phone is only used once they are all there.
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    outputs:
      photos: ${{ steps.s.outputs.photos }}
      size: ${{ steps.s.outputs.size }}
      device: ${{ steps.s.outputs.device }}
      minutes: ${{ steps.s.outputs.minutes }}
      targets: ${{ steps.s.outputs.targets }}
      fetch: ${{ steps.s.outputs.fetch }}
      folders: ${{ steps.s.outputs.folders }}
      limit: ${{ steps.s.outputs.limit }}
      journey_folder: ${{ steps.s.outputs.journey_folder }}
      key: ${{ steps.s.outputs.key }}
      download: ${{ steps.s.outputs.download }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the run settings
        id: s
        run: |
          get() { python3 -c "import json,sys; print(json.load(open('tools/realphone/run.json')).get('$1', '$2'))"; }
          photos="${{ inputs.photos }}"; size="${{ inputs.album_size }}"; device="${{ inputs.device }}"; minutes="${{ inputs.minutes }}"; tests="${{ inputs.tests }}"
          fetch=""; folders=""; limit=0; journey_folder="Sharma Wedding"
          if [ "${{ github.event_name }}" = push ]; then
            photos=$(get photos wedding); size=$(get album_size 30); device=$(get device ""); minutes=$(get minutes 40); tests=$(get tests real)
            fetch=$(get fetch ""); folders=$(get folders ""); limit=$(get limit 0); journey_folder=$(get journey_folder "Sharma Wedding")
          fi
          [ "$minutes" -gt 45 ] && minutes=45
          # Which tests: the real-photo test alone, or every phone test (screens, birthday, big
          # family, models, and the start-to-finish journey through Android's folder picker).
          # journey = the start-to-finish test alone, with every photo in the set (up to 1,000).
          case "$tests" in
            all) targets="package com.albumdone.app" ;;
            journey) targets="class com.albumdone.app.JourneyDeviceTest" ;;
            *) targets="class com.albumdone.app.RealWeddingDeviceTest" ;;
          esac
          # Photos downloaded from the harvest's sets (set:, full:, camera:, push:) are cached.
          download=""
          case "${photos%%:*}" in set|full|camera|push) [ -z "$fetch" ] && download=1 ;; esac
          key="realphone-photos-v2-$(printf '%s|%s|%s|%s' "$photos" "$folders" "$limit" "$(sha256sum tools/test-photos/one_set.py | cut -c1-16)" | sha256sum | cut -c1-24)"
          {
            echo "photos=$photos"; echo "size=$size"; echo "device=$device"; echo "minutes=$minutes"
            echo "targets=$targets"; echo "fetch=$fetch"; echo "folders=$folders"; echo "limit=$limit"
            echo "journey_folder=$journey_folder"; echo "key=$key"; echo "download=$download"
          } >> "$GITHUB_OUTPUT"
          echo "photos=$photos size=$size device=$device minutes=$minutes tests=$tests key=$key"

      - name: Photos downloaded before
        if: steps.s.outputs.download != ''
        uses: actions/cache/restore@v4
        with:
          path: photo-cache
          key: ${{ steps.s.outputs.key }}-done
          restore-keys: ${{ steps.s.outputs.key }}-

      - name: Download the photos (slowly, as Wikimedia asks)
        id: dl
        if: steps.s.outputs.download != ''
        run: |
          if [ -f photo-cache/COMPLETE ]; then
            echo "all photos were downloaded before: $(cat photo-cache/STATUS)"; exit 0
          fi
          git fetch -q --depth 1 origin harvest-data && git show FETCH_HEAD:sets.jsonl > sets.jsonl
          pip install -q pillow numpy
          set_name="${{ steps.s.outputs.photos }}"
          # full: the original files; camera: copies enlarged to camera size (Wikimedia is slow with
          # originals); set and push: at app size.
          kind="${set_name%%:*}"; { [ "$kind" = push ] || [ "$kind" = set ]; } && kind=small
          # Stop in time to keep what was downloaded (the job has 345 minutes).
          DEADLINE=$((320 * 60)) python3 tools/test-photos/one_set.py sets.jsonl "${set_name#*:}" photo-cache "$kind" "${{ steps.s.outputs.folders }}" "${{ steps.s.outputs.limit }}" 2> download-errors.txt
          tail -3 download-errors.txt || true
          du -sh photo-cache
          echo "saved=1" >> "$GITHUB_OUTPUT"

      - name: All there?
        id: c
        if: always() && steps.dl.outputs.saved == '1'
        run: |
          read n m < photo-cache/STATUS
          echo "$n of $m photos"
          # Nearly all (a few are gone from Wikimedia or are not photos): ready for the phone.
          if python3 -c "import sys; sys.exit(0 if $n >= 0.97 * $m else 1)"; then touch photo-cache/COMPLETE; echo "complete=1" >> "$GITHUB_OUTPUT"; fi

      - name: Keep the photos so far for the next run
        if: always() && steps.dl.outputs.saved == '1' && steps.c.outputs.complete != '1'
        uses: actions/cache/save@v4
        with:
          path: photo-cache
          key: ${{ steps.s.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the complete set
        if: always() && steps.c.outputs.complete == '1'
        uses: actions/cache/save@v4
        with:
          path: photo-cache
          key: ${{ steps.s.outputs.key }}-done

      - name: Stop here if photos are missing
        if: steps.dl.outputs.saved == '1' && steps.c.outputs.complete != '1'
        run: |
          echo "Not all photos yet: run again to carry on from them (no phone was used)"
          exit 1

  real-phone:
    needs: photos
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read the run settings
        id: s
        run: |
          echo "fetch=${{ needs.photos.outputs.fetch }}" >> "$GITHUB_OUTPUT"
          echo "photos=${{ needs.photos.outputs.photos }}" >> "$GITHUB_OUTPUT"
          echo "size=${{ needs.photos.outputs.size }}" >> "$GITHUB_OUTPUT"
          echo "device=${{ needs.photos.outputs.device }}" >> "$GITHUB_OUTPUT"
          echo "minutes=${{ needs.photos.outputs.minutes }}" >> "$GITHUB_OUTPUT"
          echo "targets=${{ needs.photos.outputs.targets }}" >> "$GITHUB_OUTPUT"
          echo "folders=${{ needs.photos.outputs.folders }}" >> "$GITHUB_OUTPUT"
          echo "limit=${{ needs.photos.outputs.limit }}" >> "$GITHUB_OUTPUT"
          echo "journey_folder=${{ needs.photos.outputs.journey_folder }}" >> "$GITHUB_OUTPUT"

      - name: The downloaded photos
        if: needs.photos.outputs.download != ''
        uses: actions/cache/restore@v4
        with:
          path: photo-cache
          key: ${{ needs.photos.outputs.key }}-done
          fail-on-cache-miss: true

      - name: Get the test photos
        id: p
        if: steps.s.outputs.fetch == ''
        run: |
          set_name="${{ steps.s.outputs.photos }}"
          git fetch -q --depth 1 origin test-photos
          mkdir -p app/src/androidTest/assets tmp-photos
          rm -f photo-cache/STATUS photo-cache/COMPLETE
          if [ "${set_name%%:*}" = set ]; then
            # One real event from the harvest's sets, never a mix, inside the test app.
            rm -rf app/src/androidTest/assets/wedding && mv photo-cache app/src/androidTest/assets/wedding
          elif [ "${set_name%%:*}" = full ] || [ "${set_name%%:*}" = camera ] || [ "${set_name%%:*}" = push ]; then
            # Pushed into the phone's Pictures folder before the test starts (thousands of photos,
            # or camera-size ones, would make the test app too big).
            mv photo-cache full-photos
            du -sh full-photos
            # The files to push, for gcloud (an args file: there are hundreds).
            python3 - "${{ steps.s.outputs.journey_folder }}" <<'PY'
          import os, sys, json
          folder = sys.argv[1]
          pairs = {}
          for root, _, files in os.walk("full-photos"):
              for f in sorted(files):
                  rel = os.path.relpath(os.path.join(root, f), "full-photos")
                  pairs[f"/sdcard/Pictures/{folder}/{rel}"] = os.path.join(root, f)
          with open("push-args.yaml", "w") as fh:
              fh.write("push:\n  other-files:\n")
              for k, v in pairs.items():
                  fh.write(f"    {json.dumps(k)}: {json.dumps(v)}\n")
          print(len(pairs), "photos to push")
          PY
            echo "count=$(find full-photos -name '*.jpg' | wc -l)" >> "$GITHUB_OUTPUT"
          elif [ "$set_name" = big ]; then
            # The full-size folder (1,000 photos), as in the emulator's real-wedding run.
            mkdir -p tmp-photos/local && git archive FETCH_HEAD | tar -x -C tmp-photos/local
            git fetch -q --depth 1 origin harvest-data && git show FETCH_HEAD:sets.jsonl > tmp-photos/sets.jsonl
            pip install -q pillow
            python3 tools/test-photos/big_folder.py tmp-photos/local tmp-photos/sets.jsonl app/src/androidTest/assets/wedding 1000
          else
            git cat-file -e "FETCH_HEAD:$set_name/CREDITS.json"
            git archive FETCH_HEAD "$set_name" | tar -x -C tmp-photos
            mv "tmp-photos/$set_name" app/src/androidTest/assets/wedding
          fi
          rm -rf tmp-photos
          mkdir -p app/src/androidTest/assets/wedding
          du -sh app/src/androidTest/assets/wedding
          echo "$(find app/src/androidTest/assets/wedding -name '*.jpg' | wc -l) photos"

      - uses: actions/setup-java@v4
        if: steps.s.outputs.fetch == ''
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.s.outputs.fetch == ''
        with:
          gradle-version: "8.14.3"

      - name: Build the app and its phone tests
        if: steps.s.outputs.fetch == ''
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Pick a real phone
        id: d
        if: steps.s.outputs.fetch == ''
        run: |
          gcloud firebase test android models list --filter=form=PHYSICAL --format=json --project "$PROJECT" > models.json
          device=$(python3 tools/realphone/pick_device.py "${{ steps.s.outputs.device }}" < models.json)
          echo "Picked $device"
          echo "model=${device%,*}" >> "$GITHUB_OUTPUT"
          echo "version=${device#*,}" >> "$GITHUB_OUTPUT"

      - name: Run the test on the real phone
        if: steps.s.outputs.fetch == ''
        run: |
          set -o pipefail
          dir="run-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "$dir" > results-dir.txt
          # Camera-size photos are pushed into the phone's Pictures before the test starts.
          push=""; extra=""
          if [ -f push-args.yaml ]; then push="push-args.yaml:push"; extra=",journeyPushed=1,journeyCount=${{ steps.p.outputs.count }}"; fi
          gcloud firebase test android run $push --project "$PROJECT" --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device "model=${{ steps.d.outputs.model }},version=${{ steps.d.outputs.version }},locale=en_IN,orientation=portrait" \
            --test-targets "${{ steps.s.outputs.targets }}" \
            --environment-variables "albumSize=${{ steps.s.outputs.size }},screensDir=external,journeyPhotos=1000,journeyFolder=${{ steps.s.outputs.journey_folder }},journeyMax=5000$extra" \
            --directories-to-pull /sdcard/Android/data/com.albumdone.app/files \
            --timeout "${{ steps.s.outputs.minutes }}m" --record-video --performance-metrics \
            --results-dir "$dir" --num-flaky-test-attempts 0 2>&1 | tee run.txt || touch tests-failed

      - name: Fetch the video, logs and screenshots
        if: always()
        run: |
          mkdir -p out
          cp models.json run.txt out/ 2>/dev/null || true
          bucket=$(grep -o 'test-lab-[a-z0-9_-]*' run.txt 2>/dev/null | head -1 || true)
          dir=$(cat results-dir.txt 2>/dev/null || true)
          fetch="${{ steps.s.outputs.fetch }}"
          if [ -n "$fetch" ]; then bucket="${fetch%%/*}"; dir="${fetch#*/}"; fi
          if [ -n "$bucket" ] && [ -n "$dir" ]; then
            mkdir -p out/lab
            gsutil -m -q cp -r "gs://$bucket/$dir/*" out/lab/ || echo "could not copy the results"
          fi
          # The phone's own folder (screenshots, report) and Test Lab's files, flattened for reading.
          find out/lab -name 'video.mp4' -exec cp {} out/video.mp4 \; 2>/dev/null || true
          find out/lab -name 'logcat' -exec sh -c 'grep -E "AlbumDone|AndroidRuntime|FATAL|TestRunner" "$1" | tail -n 4000 > out/logcat-app.txt' _ {} \; 2>/dev/null || true
          shots=$(find out/lab -type d -path '*com.albumdone.app/files/screens' | head -1)
          [ -n "$shots" ] && mv "$shots" out/screens || true
          # Not the app files, nor the photos pushed onto the phone (Test Lab keeps them with the results).
          find out/lab \( -name 'video.mp4' -o -name '*.apk' -o -iname '*.jpg' -o -iname '*.jpeg' \) -delete 2>/dev/null || true
          du -sh out
          grep -h "Real wedding:" out/logcat-app.txt 2>/dev/null | tail -1 || true
          head -1 out/screens/real-wedding-report.txt 2>/dev/null || true

      # Not after a run stopped before it reached a phone: that would replace a phone's results
      # with nothing.
      - name: Send them to the real-phone-results branch
        if: always() && (steps.d.outputs.model != '' || steps.s.outputs.fetch != '')
        run: |
          echo "Run ${{ github.run_number }} for commit ${{ github.sha }}: photos ${{ steps.s.outputs.photos }} on ${{ steps.d.outputs.model }} (API ${{ steps.d.outputs.version }})" > out/RUN.txt
          # One results branch per phone, so runs on several phones do not overwrite each other.
          branch=real-phone-results; [ -n "${{ steps.d.outputs.model }}" ] && [ "${{ steps.d.outputs.model }}" != a15 ] && branch="real-phone-results-${{ steps.d.outputs.model }}"
          cd out
          git init -q -b "$branch"
          git config user.name "phone-test"
          git config user.email "phone-test@users.noreply.github.com"
          git add -A
          git commit -q -m "Real phone run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"

      - name: Fail if the test failed
        run: test ! -f tests-failed
