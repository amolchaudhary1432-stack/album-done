name: Train on Kaggle GPU

# Runs a training script on the owner's free Kaggle GPU (secrets KAGGLE_JSON, KAGGLE_USERNAME)
# and brings its output back to the kaggle-results branch. Only freely licensed test photos and
# numbers go to Kaggle, never a couple's photos. tools/kaggle/run.json names the script.
on:
  push:
    branches: ['claude/**']
    paths: ['tools/kaggle/**', '.github/workflows/kaggle-train.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Kaggle sign-in
        env:
          KEY: ${{ secrets.KAGGLE_JSON }}
        run: |
          # The secret is either the new KGAT_ token or an old kaggle.json; never printed.
          mkdir -p ~/.kaggle && K=$(printf '%s' "$KEY" | tr -d '[:space:]')
          case "$K" in
            \{*) printf '%s' "$KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json && echo "kaggle.json form";;
            ?*) printf '%s' "$K" > ~/.kaggle/access_token && chmod 600 ~/.kaggle/access_token && echo "token form, ${#K} characters";;
            *) echo "KAGGLE_JSON is empty"; exit 1;;
          esac
      - name: Kaggle tools
        run: |
          # run.json: "mode" send (upload, start, wait a little) or fetch (only collect an earlier job's
          # output); "wait" minutes to wait here (default 15), so this machine is not billed while Kaggle works.
          python3 -c "import json; r=json.load(open('tools/kaggle/run.json')); print('SLUG=%s\nMODE=%s\nWAIT=%s' % (r['slug'], r.get('mode', 'send'), r.get('wait', 15)))" >> $GITHUB_ENV
          python3 -m pip install -q "kaggle>=1.8"
          kaggle --version
          kaggle kernels list --mine --page-size 5 || true
      - name: Upload the photos (freely licensed Commons sets only)
        run: |
          U=$(python3 -c "import json; print(json.load(open('tools/kaggle/run.json')).get('upload', ''))")
          [ "$MODE" = send ] && [ "$U" = twins ] || exit 0
          git fetch -q --depth 1 origin teach-sheets
          mkdir -p data && git --work-tree=data checkout FETCH_HEAD -- photos index.json && git reset -q
          cp tools/reasoner/frame-labels.tsv tools/reasoner/judge_test.py data/
          git show FETCH_HEAD:README.md > data/CREDITS.md; git --work-tree=data checkout FETCH_HEAD -- $(git ls-tree --name-only FETCH_HEAD | grep credits.json) && git reset -q
          printf '{"title": "album-done-twins", "id": "%s/album-done-twins", "licenses": [{"name": "other"}]}' "$KAGGLE_USERNAME" > data/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/album-done-twins" >/dev/null 2>&1; then
            kaggle datasets version -p data -m "update" --dir-mode zip -q
          else
            kaggle datasets create -p data --dir-mode zip -q
          fi
          for i in $(seq 1 30); do s=$(kaggle datasets status "$KAGGLE_USERNAME/album-done-twins" 2>&1 | tail -1); echo "$s"; case "$s" in *ready*) break;; esac; sleep 20; done
      - name: Upload the web photo list (Commons links only, no photos)
        run: |
          U=$(python3 -c "import json; print(json.load(open('tools/kaggle/run.json')).get('upload', ''))")
          [ "$MODE" = send ] && [ "$U" = weblist ] || exit 0
          git fetch -q --depth 1 origin harvest-data
          mkdir -p wl && git show FETCH_HEAD:sets.jsonl > sets.jsonl
          python3 - <<PY
          import json, subprocess
          occ = set(json.load(open('tools/kaggle/run.json')).get('occasions', ['WEDDING', 'ENGAGEMENT']))
          with open('wl/weblist.jsonl', 'w') as f:
              for l in open('sets.jsonl'):
                  s = json.loads(l)
                  if s['occasion'] not in occ: continue
                  try: cr = json.loads(subprocess.run(['git', 'show', 'FETCH_HEAD:sets/%s.credits.json' % s['id']], capture_output=True, text=True).stdout)
                  except Exception: continue
                  for x in cr.get('files', []):
                      f.write(json.dumps({'set': s['id'], 'file': x['file'], 'url': x['thumb'], 'occasion': s['occasion']}) + '\n')
          PY
          wc -l wl/weblist.jsonl
          printf '{"title": "album-done-weblist", "id": "%s/album-done-weblist", "licenses": [{"name": "other"}]}' "$KAGGLE_USERNAME" > wl/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/album-done-weblist" >/dev/null 2>&1; then kaggle datasets version -p wl -m update -q; else kaggle datasets create -p wl -q; fi
          for i in $(seq 1 30); do s=$(kaggle datasets status "$KAGGLE_USERNAME/album-done-weblist" 2>&1 | tail -1); echo "$s"; case "$s" in *ready*) break;; esac; sleep 20; done
      - name: Upload what earlier runs already scanned
        run: |
          U=$(python3 -c "import json; print(json.load(open('tools/kaggle/run.json')).get('upload', ''))")
          [ "$MODE" = send ] && [ "$U" = scanstate ] || exit 0
          mkdir -p st && if git fetch -q --depth 1 origin kaggle-results; then
            for f in $(git ls-tree -r --name-only FETCH_HEAD | grep 'files_done.txt$'); do git show "FETCH_HEAD:$f" >> st/files_done_all.txt; done; fi
          touch st/files_done_all.txt; wc -l st/files_done_all.txt
          printf '{"title": "album-done-scanstate", "id": "%s/album-done-scanstate", "licenses": [{"name": "other"}]}' "$KAGGLE_USERNAME" > st/dataset-metadata.json
          if kaggle datasets status "$KAGGLE_USERNAME/album-done-scanstate" >/dev/null 2>&1; then kaggle datasets version -p st -m update -q; else kaggle datasets create -p st -q; fi
          for i in $(seq 1 30); do s=$(kaggle datasets status "$KAGGLE_USERNAME/album-done-scanstate" 2>&1 | tail -1); echo "$s"; case "$s" in *ready*) break;; esac; sleep 20; done
      - name: Send the job
        if: env.MODE == 'send'
        run: |
          SCRIPT=$(python3 -c "import json; print(json.load(open('tools/kaggle/run.json'))['script'])")
          mkdir -p job && cp "tools/kaggle/$SCRIPT" job/run.py
          python3 - <<PY
          import json, os
          run = json.load(open('tools/kaggle/run.json'))
          json.dump({"id": f"{os.environ['KAGGLE_USERNAME']}/{run['slug']}", "title": run['slug'], "code_file": "run.py",
                     "language": "python", "kernel_type": "script", "is_private": True, "enable_gpu": run.get("gpu", True),
                     "enable_internet": True, "dataset_sources": [f"{os.environ['KAGGLE_USERNAME']}/{d}" for d in run.get('datasets', [])], "model_sources": [],
                     "kernel_sources": [f"{os.environ['KAGGLE_USERNAME']}/{k}" for k in run.get('kernels', [])], "competition_sources": []}, open('job/kernel-metadata.json', 'w'), indent=1)
          PY
          cat job/kernel-metadata.json
          N=$(python3 -c "import json; print(json.load(open('tools/kaggle/run.json')).get('shards', 0))")
          if [ "$N" -gt 0 ]; then
            # The same job on N Kaggle machines at once, each doing every N-th file (SHARD=i/N).
            for i in $(seq 0 $((N-1))); do
              rm -rf "job$i" && cp -r job "job$i"
              { echo "import os; os.environ['SHARD'] = '$i/$N'"; cat job/run.py; } > "job$i/run.py"
              python3 -c "import json,sys; m=json.load(open('job$i/kernel-metadata.json')); m['id']+='-$i'; m['title']+='-$i'; json.dump(m, open('job$i/kernel-metadata.json','w'))"
              kaggle kernels push -p "job$i"
            done
          else
            kaggle kernels push -p job
          fi
      - name: Wait for it
        run: |
          for i in $(seq 1 "$WAIT"); do
            s=$(kaggle kernels status "$KAGGLE_USERNAME/$SLUG" 2>&1 | tail -1); echo "$(date -u +%H:%M) $s"
            case "$s" in *COMPLETE*|*complete*|*ERROR*|*error*|*CANCEL*|*cancel*) echo "FINISHED=1" >> $GITHUB_ENV; break;; esac
            sleep 60
          done
      - name: Bring the output back
        if: always()
        run: |
          # Each job's output in its own folder on kaggle-results; run.json "also_fetch" collects earlier jobs too.
          mkdir -p res && if git fetch -q --depth 1 origin kaggle-results; then git --work-tree=res checkout FETCH_HEAD -- . && git reset -q; fi
          slugs=$(python3 -c "import json; r=json.load(open('tools/kaggle/run.json')); print(' '.join(r.get('also_fetch', [])))")
          [ "$FINISHED" = 1 ] && slugs="$slugs $SLUG"
          for s in $slugs; do
            st=$(kaggle kernels status "$KAGGLE_USERNAME/$s" 2>&1 | tail -1); echo "$s: $st"
            case "$st" in *COMPLETE*|*complete*|*ERROR*|*error*) rm -rf "res/$s" && mkdir -p "res/$s" && kaggle kernels output "$KAGGLE_USERNAME/$s" -p "res/$s" || true;; esac
            cat res/$s/scores.txt 2>/dev/null || true
          done
          # Found photos stay on Kaggle (cc_img/, mp_img/...): only lists and numbers come back; a small
          # sample of each image folder is kept for looking at.
          for d in res/*/*_img res/*/judge-tmp; do [ -d "$d" ] || continue; ls "$d" | wc -l > "$d.count"; ls "$d" | head -200 | sed "s#^#$d/#" > "$d.keep"; find "$d" -type f | grep -v -F -f "$d.keep" | xargs -r rm -f; rm -f "$d.keep"; done
          find res -size +90M -delete; rm -f res/*.log res/*.tsv res/*.json
          cd res && rm -rf .git && git init -q -b kaggle-results && git config user.name "kaggle" && git config user.email "kaggle@users.noreply.github.com"
          printf '# Kaggle results\n\nOne folder per job. Numbers only (freely licensed test photos; no couple photos).\n' > README.md
          git add -A && (git commit -q -m "Kaggle output: $slugs" || exit 0) && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:kaggle-results
